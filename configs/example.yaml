# VPN Kongtrol — Example Configuration
# Copy to ~/.kongtrol/kongtrol.yaml and edit as needed.
# Run 'kongtrol init' for an interactive setup wizard.
#
# Credentials (passwords) are NEVER stored here.
# Store them with: kongtrol config set-credential <profile> password

vpns:
  office:
    type: forticlient
    version: "6.4"               # informational: Kongtrol detects the installed version (docs/forticlient-support.md)
    # SECURITY: keep false in production. true allows auto-accepting
    # untrusted certificate warnings in FortiClient GUI automation (MITM risk).
    # allow_insecure_cert: false
    host: vpn.empresa.com
    port: 443
    tunnel_name: "Office"        # exactly as configured in FortiClient
    auth:
      method: certificate+credentials
      cert: ~/.kongtrol/certs/office.crt
      key: ~/.kongtrol/certs/office.key
      username: your_username    # or use username_keychain below
      # username_keychain: office.username   # keychain key name
      # password_keychain: office.password   # keychain key name (recommended)
    # priority only breaks ties between overlapping policies: the higher number
    # is evaluated first. It never connects or switches profiles.
    priority: 10
    kill_switch: true
    # Provider attach mode (forticlient, protonvpn, nordvpn, surfshark):
    # `up` attaches to a tunnel already up in the app; else tries automation
    # (GUI automation here) and, if that fails, opens the app and waits for
    # you to connect there.
    # auto_connect: true          # false = never automate, just wait for you
    # wait_timeout: 5m            # how long `up` waits for you in the app
    # interface: "Fortinet*"      # override the tunnel interface name pattern
    # app_path: "C:\\Program Files\\Fortinet\\FortiClient\\FortiClient.exe"

  server:
    type: openvpn
    # Self-contained profile: certs are embedded (<ca>/<cert>/<key>/<tls-crypt>)
    # or referenced with paths relative to the .ovpn file. Kongtrol runs
    # openvpn with --cd <config dir>, so relative paths resolve like OpenVPN GUI.
    config: ~/.kongtrol/configs/server.ovpn
    auth:
      method: certificate          # no cert/key needed: the .ovpn references them
    # Optional: openvpn binary override. Default lookup: PATH, then the Windows
    # registry / %ProgramFiles%\OpenVPN\bin, or /usr/sbin, /usr/local/sbin,
    # /opt/homebrew/sbin on Unix.
    # binary_path: "C:\\Program Files\\OpenVPN\\bin\\openvpn.exe"
    priority: 20
    # failover: backups that reach the SAME networks, tried in order if this
    # profile drops and cannot reconnect. Without it Kongtrol only retries this
    # profile and notifies you; it never connects another VPN on its own.
    # failover: [dev-server-b]

  aws:
    type: openvpn
    config: ~/.kongtrol/configs/aws.ovpn
    auth:
      method: certificate
      cert: ~/.kongtrol/certs/aws.crt
      key: ~/.kongtrol/certs/aws.key
    priority: 20

  us-content:
    type: protonvpn
    # Official Proton VPN app. Linux: connects through the `protonvpn` CLI
    # (sign in once). Windows / macOS: no CLI, so `up` opens the app and
    # waits for you to connect there (or use type: wireguard with a .conf).
    country: US      # code or name; or city: "New York"; or server: "CH#242"
    # (all empty = fastest; legacy `server: US` still works)
    protocol: wireguard   # legacy protonvpn-cli only
    auth:
      method: credentials
      username_keychain: proton.username
      # password stored via: kongtrol config set-credential us-content password
    priority: 5

  nord:
    type: nordvpn
    # Official NordVPN app: NordVPN.exe switches on Windows, the `nordvpn`
    # CLI on Linux (run `nordvpn login` once). macOS: no CLI, so `up` opens
    # the app and waits for you to connect there.
    # Target: all empty = quick connect; country / city; group ("P2P",
    # "Dedicated IP", "Double VPN"); or server ("United States #3710" on
    # Windows, "us3710" on Linux). Legacy `server: "United States"` still works.
    # `protocol` is ignored: the NordVPN client keeps its own setting.
    country: "United States"
    # group: P2P
    auth:
      method: credentials   # session lives in the NordVPN client, nothing in keychain
    priority: 5

  surf:
    type: surfshark
    # Official Surfshark app. Surfshark has no CLI: `up` attaches to a tunnel
    # already up, or opens the app and waits for you to connect there;
    # `down` asks you to disconnect in the app. Location is chosen in the app.
    # wait_timeout: 10m
    # interface: "Surfshark*"     # if your adapter has another name
    auth:
      method: credentials   # session lives in the Surfshark app
    priority: 5

  # ── Additional adapters ────────────────────────────────────────────────────

  corporate-cisco:
    type: ciscoanyconnect
    host: vpn.corp.com
    auth:
      method: credentials
      username: your_username
      password_keychain: cisco.password
    priority: 10

  wg-home:
    type: wireguard
    config: ~/.kongtrol/configs/wg-home.conf  # path to WireGuard .conf file
    auth:
      method: certificate   # WireGuard uses keys embedded in .conf
    priority: 15

  global-protect:
    type: globalprotect
    host: gateway.corp.com
    auth:
      method: credentials
      username_keychain: gp.username
      password_keychain: gp.password
    priority: 10

  tailscale-mesh:
    type: tailscale
    # host: exit-node hostname (optional — routes through Tailscale exit node)
    # password: Tailscale auth key (optional — reuses existing session if empty)
    auth:
      method: credentials
      # password_keychain: tailscale.authkey
    priority: 5

  warp:
    type: cloudflarewarp
    # No credentials needed — device must be registered via 'warp-cli register'
    auth:
      method: credentials
    priority: 1
    kill_switch: false


policies:
  - name: "Office servers"
    match:
      ip_ranges:
        - "10.10.0.0/16"
        - "192.168.50.0/24"
    via: office

  - name: "AWS workloads"
    match:
      ip_ranges:
        - "172.31.0.0/16"
        - "10.200.0.0/16"
      domains:
        - "*.amazonaws.com"
        - "*.aws.empresa.com"
    via: aws
    # While the "aws" tunnel is off (you decide which tunnels are up):
    #   allow   (default) normal internet + a notice in tray/dashboard
    #   block   never through the normal internet (for domains: only the
    #           IPs resolved so far — partial protection)
    #   connect Kongtrol connects the tunnel when the traffic shows up
    on_tunnel_down: block

  - name: "Dev server"
    match:
      ip_ranges:
        - "185.x.x.x/32"        # replace with your server's actual IP
    via: server

  - name: "US geo-restricted content"
    match:
      domains:
        - "netflix.com"
        - "*.netflix.com"
        - "hulu.com"
    via: us-content

  - name: "Corporate apps (experimental)"
    match:
      apps:
        - "chrome"
        - "teams*"
        - "*\\Code.exe"
    via: office

  # No default rule: unmatched traffic goes through the physical interface.
  # To force all unmatched traffic through a VPN, add:
  # - name: "Default route"
  #   match:
  #     ip_ranges: ["0.0.0.0/0"]
  #   via: office


security:
  kill_switch:
    enabled: true
    # Split-tunnel aware: never blocks a tunnel you turned off. When a
    # protected tunnel drops unexpectedly, only ITS destinations are blocked
    # (routes it had + its policies' IPs) until it reconnects or you run
    # `kongtrol down`. A full-tunnel profile (default route through the
    # tunnel) blocks all but the VPN endpoints while dropped.
    mode: strict    # legacy; "loose" now means the same as allow_lan: true
    allow_lan: true # keep the LAN reachable while a full tunnel is dropped

  dns_guard:
    enabled: true
    fallback_dns: "1.1.1.1"

  integrity_check:
    enabled: true
    interval: "120s"
    # Optional: verify your public IP matches what's expected per VPN.
    # expected_ips:
    #   office: "203.x.x.x"

  # Public IP lookup — OFF by default (opt-in). When on, Kongtrol asks an
  # external service for your public IP (that service sees it), only when a
  # tunnel connects or disconnects (at most once per 30 s) and when you ask
  # (kongtrol ip, "Revisar" in the dashboard, the tray). The kill switch
  # and DNS guard do not need it. Also enables the leak check against
  # integrity_check.expected_ips. Toggle: kongtrol config public-ip on|off.
  public_ip_check:
    enabled: false
    # endpoints:                  # https only, tried in order; default below
    #   - https://api.ipify.org
    #   - https://icanhazip.com

  # Legacy: leak_detection.enabled: true still opts in to the lookup above;
  # its old interval and action keys are ignored and dropped on save: a
  # leak only notifies, it never drives the kill switch (ADR-0041).

  audit_log:
    path: ~/.kongtrol/audit.log
    max_size_mb: 10      # one file per day up to 10 MB, then audit-YYYY-MM-DD.1.log, .2… (default 100)
    retention_days: 30   # days kept, today included (0 = today and yesterday, max 365)
    sign: true       # HMAC-SHA256 per entry (key stored in OS keychain)


monitor:
  enabled: true
  dashboard:
    port: 9741
    bind: "127.0.0.1"   # NEVER set to 0.0.0.0 without adding auth

  health_check:
    interval: "30s"
    timeout: "10s"

  history:
    path: ~/.kongtrol/history.json
    flush_interval: "30s"

  split_dns:
    enabled: true
    interval: "60s"

  scheduler:
    enabled: false   # rules, interval and on/off apply without restarting Kongtrol
    interval: "1m"
    rules:
      - name: "work-hours"
        profiles: ["office"]
        weekdays: ["mon", "tue", "wed", "thu", "fri"]
        start: "09:00"
        end: "18:00"
        # enabled: false   # pause this rule without deleting it (default on)

  alerts:
    on_vpn_drop:
      actions: ["notify", "log"]
    on_leak_detected:
      actions: ["kill_switch", "notify", "log"]
    on_high_latency_ms: 500
    on_reconnect_attempts: 3

# New version notice (ADR-0034). Off by default: with check_enabled false Kongtrol never
# contacts GitHub. When true it asks api.github.com at most once a day (GitHub sees your IP
# and "kongtrol/<version>") and only tells you how to update; it never downloads anything.
# Toggle: kongtrol config update-check on|off, or the dashboard (Ajustes).
updates:
  check_enabled: false
