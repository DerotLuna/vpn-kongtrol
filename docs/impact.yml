# Change-impact map — version 1.17 · 2026-11-25
#
# For every feature: the code that implements it (globs, ** = any depth)
# and the surfaces that describe it to users. A surface is "path" (the
# whole file) or "path#name", where the file marks the paragraph with a
# `feature:<name>` anchor: `<!-- feature:name -->` in Markdown, a
# `// feature:name` comment in TS/TSX/JS. One anchor line may list several
# names. Generated files (docs/CLI*.md, docs/CONFIG*.md, docs/cli.json) are
# not listed: `make docs` keeps them current.
#
# Used by internal/impact (go run ./internal/impact/impactcheck): a PR that
# touches a feature's code but none of its surfaces gets a non-blocking
# warning ("si no aplica, explica el motivo en el PR"). The test in
# internal/impact fails only when a top-level package under internal/ or
# cmd/ is neither covered by a feature nor listed under `internal`.

# Packages with no user-facing surface of their own.
internal:
  - internal/docgen      # generates the reference docs
  - internal/netstats    # traffic counters shown through status/dashboard
  - internal/vpndetect   # client detection used by wizard/doctor
  - internal/impact      # this checker

