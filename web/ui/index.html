<!doctype html>
<!-- Kongtrol UI shell · v0.3.1 · 2026-11-19 -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- SVG favicon from the single brand source: the solid silhouette
         (lines blur at tab size, ADR-0047) on a transparent background; its
         embedded prefers-color-scheme style draws it white on a dark browser
         theme and black on a light one. No bitmap needed: the panel opens in
         desktop browsers, which all support SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg" />
    <meta name="description" content="Panel local de Kongtrol: tus VPN, reglas, tráfico y protección en un solo lugar." />
    <title>Kongtrol</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
