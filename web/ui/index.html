<!doctype html>

<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

         desktop browsers, which all support SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg" />
    <meta name="description" content="Panel local de Kongtrol: tus VPN, reglas, tráfico y protección en un solo lugar." />
    <title>Kongtrol</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
