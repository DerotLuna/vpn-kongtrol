<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPN Kongtrol</title>
  <link rel="icon" type="image/png" href="/logo-kong.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="/logo-kong.png" alt="VPN Kongtrol" class="brand-logo" />
      <span class="brand-name">VPN Kongtrol</span>
    </div>
    <div class="header-right">
      <span id="ws-label" class="ws-label">connecting…</span>
      <div id="connection-indicator" class="indicator disconnected" title="Daemon connection"></div>
    </div>
  </header>

  <main>
    <section class="card" id="tunnels-section">
      <h2>Tunnels</h2>
      <table id="tunnels-table">
        <thead>
          <tr>
            <th>Profile</th>
            <th>Status</th>
            <th>Assigned IP</th>
            <th>Uptime</th>
            <th>↑ Sent</th>
            <th>↓ Received</th>
            <th>Latency</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tunnels-body">
          <tr><td colspan="8" class="empty">Connecting to daemon…</td></tr>
        </tbody>
      </table>
    </section>

    <div class="side-grid">
      <section class="card" id="security-section">
        <h2>Security</h2>
        <ul id="security-list">
          <li>
            <span class="label">Kill Switch</span>
            <span id="ks-status" class="badge">—</span>
          </li>
          <li>
            <span class="label">DNS Guard</span>
            <span id="dns-status" class="badge">—</span>
          </li>
          <li>
            <span class="label">Leak Check</span>
            <span id="leak-status" class="badge">—</span>
          </li>
          <li>
            <span class="label">Public IP</span>
            <span id="public-ip" class="mono">—</span>
          </li>
          <li>
            <span class="label">Last checked</span>
            <span id="leak-time" class="muted">—</span>
          </li>
        </ul>
      </section>

      <section class="card" id="routes-section">
        <h2>Active Routes</h2>
        <ul id="routes-list">
          <li class="empty">Loading…</li>
        </ul>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
