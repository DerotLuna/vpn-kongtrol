# Dependabot version updates — kongtrol
# Version 1.0 · 2026-11-17
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Weekly, grouped per ecosystem so each part gets at most one PR per week.
# Security updates are separate (repo setting "Dependabot security updates").
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  # pnpm projects use the npm ecosystem (Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    groups:
      landing-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    groups:
      ui-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
