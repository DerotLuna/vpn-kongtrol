name: ci

# Build only what changed.
# - push to main: workflow-level `paths` skips the run when nothing here is touched
#   (landing/** has its own landing.yml). pull_request has NO paths filter so the
#   required `ci-ok` check always reports (see the ci-ok job).
#   https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
# - Job level: `paths` cannot gate single jobs, so the `changes` job
#   (dorny/paths-filter) decides which of go / ui run. A job skipped by `if:`
#   reports success, so it does not block required checks the way a workflow
#   skipped by `paths` would.
#   https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/troubleshooting-required-status-checks#handling-skipped-but-required-checks
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "assets/**"
      - "configs/**"
      - "Makefile"
      - "docs/impact.yml"
      - ".goreleaser.yaml"
      - "packaging/**"
      - "install.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes: its
# result would be stale anyway. Tags never reach this workflow (release.yml
# has no concurrency group), so nothing that publishes is ever cancelled.
# docs/adr/0059-ci-parallel-jobs-and-superseded-runs.md
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# PRs: a newer push cancels the older run. Pushes to main get one group per
# commit (never cancelled or queued away), so every commit keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # public repo: paths-filter's git fetch needs no token
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            go:
              - "**/*.go"
              - "go.mod"
              - "go.sum"
              - "web/**"
              - "assets/**"
              - "configs/**"
              - "Makefile"
              - "docs/impact.yml"
              - ".github/workflows/ci.yml"
            ui:
              - "web/ui/**"
              - "assets/brand/**"
              - ".github/workflows/ci.yml"
            packaging:
              - ".goreleaser.yaml"
              - "packaging/**"
              - "install.sh"
              - "install.ps1"
              - ".github/workflows/release.yml"
              - ".github/workflows/ci.yml"

  # Release packaging (docs/adr/0025): GoReleaser config, installer/app/npm
  # scripts and install.sh, checked without publishing anything. The macOS
  # app and the Windows installer are built for real only on version tags.
  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: true
      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "v2.20.3" # exact, same as release.yml; Renovate bumps it
          args: check
      - name: Shell scripts parse
        run: |
          bash -n packaging/macos/build-app.sh
          bash -n packaging/homebrew/publish.sh
          sh -n install.sh
      - name: Install scripts (offline checks)
        run: bash packaging/tests/install-scripts.sh
      - name: npm packages build
        run: |
          mkdir -p /tmp/kt-dist
          # The six cross-compiles are independent: run them at once (the Go
          # build cache is safe for concurrent builds); any failure fails the step.
          pids=()
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            ext=""; case "$t" in windows-*) ext=".exe" ;; esac
            GOOS="${t%-*}" GOARCH="${t#*-}" CGO_ENABLED=0 go build -o "/tmp/kt-dist/kongtrol-$t$ext" ./cmd/kongtrol &
            pids+=("$!")
          done
          for p in "${pids[@]}"; do wait "$p"; done
          node packaging/npm/build.mjs 0.0.0-ci /tmp/kt-dist /tmp/kt-npm
          mkdir -p /tmp/kt-npm/kongtrol/node_modules/@kongtrol
          cp -r /tmp/kt-npm/cli-linux-x64 /tmp/kt-npm/kongtrol/node_modules/@kongtrol/
          node /tmp/kt-npm/kongtrol/bin/kongtrol.js version --plain
          (cd /tmp/kt-npm/kongtrol && npm pack --dry-run)

  # Dashboard UI (web/ui), two parallel jobs so the Go tests wait only for
  # the build: `ui-build` (typecheck + production build, handed to the Go
  # test job so the binary is tested with the real embedded UI instead of
  # the "not built" placeholder) and `ui-check` (lint + unit tests).
  ui-build:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/ui/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (tsc + vite)
        run: pnpm run build
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-ui-dist
          path: web/ui/dist
          include-hidden-files: true
          retention-days: 3

  ui-check:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/ui/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint (tsc + oxlint)
        run: pnpm run lint
      - name: Test
        run: pnpm run test

  test:
    name: test (${{ matrix.os }})
    needs: [changes, ui-build]
    # Run after `ui-build` when it ran, without it when it was skipped; never
    # after a failed UI build. It does not wait for `ui-check` (lint + unit
    # tests): nothing here uses their output, and ci-ok still requires them.
    # On windows-latest this also parses every FortiClient automation script
    # with the Windows PowerShell 5.1 parser (gui_windows_test.go; never runs
    # them). It fails, not skips, under CI, so a script parse error blocks via
    # ci-ok. No separate job: internal/vpn/forticlient/** is already **/*.go.
    if: ${{ !cancelled() && needs.changes.outputs.go == 'true' && needs.ui-build.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the UI built in this run
        if: needs.ui-build.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-ui-dist
          path: web/ui/dist
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: true
      - name: Test
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: go test -shuffle=on -coverprofile=coverage.out ./cmd/kongtrol ./internal/... ./assets ./web
      - name: Vet
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: go vet ./cmd/kongtrol ./internal/... ./assets ./web
      # The tray: pure Go on Linux/Windows, cgo (Cocoa) on macOS (default
      # CGO_ENABLED=1 there). Released by release.yml (docs/adr/0025).
      - name: Tray (vet + test)
        shell: bash
        run: |
          go vet ./cmd/kongtrol-tray
          go test ./cmd/kongtrol-tray
      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      # Own cache for the -race build: setup-go keys its cache only by OS, Go
      # version and go.sum, so the Linux jobs share ONE key and whichever job
      # saves it first decides what it holds; -race objects were never in it.
      # https://github.com/actions/setup-go#caching-dependency-files-and-build-outputs
      - name: Go cache paths
        id: goenv
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Go build cache (race)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.goenv.outputs.build }}
            ${{ steps.goenv.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-race-${{ runner.os }}-
      - name: Race detector
        run: go test -race -shuffle=on ./cmd/kongtrol ./internal/...

  security:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No cache: this job finishes first, so with `cache: true` it saved the
      # shared Linux setup-go key (run 44435646995) with almost no build
      # output in it, and test/race/packaging restored that thin cache until
      # go.sum changed.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 # exact; bump by hand (advisories come from the online DB)
          govulncheck ./cmd/... ./internal/...

  # Single required check for branch rulesets ("ci-ok"). It always runs and
  # passes when every job either succeeded or was skipped by the `changes`
  # filter, so path-scoped PRs (e.g. landing-only) are never left pending.
  # A workflow skipped by `on.pull_request.paths` never reports a status,
  # which would block required checks — hence no paths filter on pull_request.
  ci-ok:
    if: always()
    needs: [changes, ui-build, ui-check, test, race, security, packaging]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"' && exit 1 || exit 0
