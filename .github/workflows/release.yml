name: release

# Version 2.2.0 · 2026-11-19 — decision and sources:
# docs/adr/0025-desktop-release-channels-first-run.md; job layout:
# docs/adr/0059-ci-parallel-jobs-and-superseded-runs.md; no caches, exact
# tool versions, `release` environment: docs/adr/0063-*.md.
#
# Runs only for version tags (v*), so landing-only or docs-only pushes never
# start it. No concurrency group: a release run is never cancelled. Jobs:
#   ui       builds web/ui once; every Go binary below embeds it.
#   macos    Kongtrol.app (universal, tray needs cgo + Cocoa) → zip.
#   windows  CLI + tray + per-user Inno Setup installer (optionally signed
#            through SignPath Foundation once the project is approved).
#   test     go test -race of the release sources, read-only token, in
#            parallel with macos and windows.
#   release  after all of the above: GoReleaser: CLI for every OS, Linux/Windows tray,
#            archives, .deb/.rpm, SBOMs, checksums.txt (covering the macOS
#            and Windows files too), cosign signature, GitHub release and
#            Scoop / winget / AUR. Then build provenance attestations, the
#            Homebrew formula and the npm packages.
# Every package-manager publisher skips itself when its secret is not set.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Exact pnpm from web/ui/package.json `packageManager` (Renovate bumps it).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/ui/package.json
      # No dependency cache in release jobs: a cache written by a main-branch
      # run must not feed a release build (ADR-0063).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build UI
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html || { echo "web/ui/dist/index.html missing: the release would ship without the UI"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-ui-dist
          path: web/ui/dist
          include-hidden-files: true
          retention-days: 3

  macos:
    needs: ui
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-ui-dist
          path: web/ui/dist
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      - name: Build Kongtrol.app
        run: bash packaging/macos/build-app.sh "${GITHUB_REF_NAME#v}" dist-extra
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: dist-extra/Kongtrol-macos-universal.zip
          retention-days: 3

  windows:
    needs: ui
    runs-on: windows-latest
    # No `environment:` yet: a second job in the protected `release`
    # environment would ask for a second approval per release. It moves there
    # together with the SignPath secrets (#30, docs/DEVELOPMENT.md).
    defaults:
      run:
        shell: bash
    steps:
      # Code signing through SignPath Foundation (free for OSS). Skipped until
      # the secret and the variables exist (see docs/DEVELOPMENT.md, Release).
      # Secrets live only in the steps that use them; `if:` reads this
      # non-secret output instead of a job-wide secret env.
      - name: Is signing configured?
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "enabled=$([ -n "$SIGNPATH_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-ui-dist
          path: web/ui/dist
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      - name: Build CLI and tray
        run: |
          ver="${GITHUB_REF_NAME#v}"
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/logo.ico -o cmd/kongtrol/rsrc_windows_amd64.syso
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/logo.ico -o cmd/kongtrol-tray/rsrc_windows_amd64.syso
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${ver}" -o build/win/kongtrol.exe ./cmd/kongtrol
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${ver}" -o build/win/kongtrol-tray.exe ./cmd/kongtrol-tray
          ./build/win/kongtrol.exe version --plain
      - name: Upload binaries for signing
        id: unsigned-bin
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-binaries
          path: build/win/*.exe
          retention-days: 1
      - name: Sign binaries (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-bin.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/win
      # Inno Setup 6.7.4 from its official release (Authenticode-signed by
      # the vendor), unpacked portable into the runner's temp dir. The script
      # is verified with this version; Inno Setup 7 is untested here.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-6.7.4.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $exe
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys') { throw "Inno Setup signature: $($sig.Status)" }
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/PORTABLE=1','/CURRENTUSER','/NORESTART',"/DIR=$env:RUNNER_TEMP\is6" -Wait
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\is6\ISCC.exe" "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" "/DSourceDir=$PWD\build\win" "/DOutputDir=$PWD\dist-extra" packaging\windows\kongtrol.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reinstall with the setup dashboard running
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'dist-extra\Kongtrol-Setup-windows-amd64.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'kongtrol-setup-test'
          $state = Join-Path $env:USERPROFILE '.kongtrol'
          $pidFile = Join-Path $state 'run\kongtrol.pid'
          function Install-TestCopy($stage) {
            $log = Join-Path $env:RUNNER_TEMP "kongtrol-$stage.log"
            $setupArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
              '/MERGETASKS=!helper,!autostart,!path', "/DIR=`"$directory`"", "/LOG=`"$log`""
            $process = Start-Process $setup -ArgumentList $setupArgs -PassThru
            if (!$process.WaitForExit(90000) -or $process.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
              throw "Installer failed in stage $stage"
            }
            if (Select-String -LiteralPath $log -SimpleMatch 'Parameters: service install' -Quiet) {
              throw "Installer ran the deselected network helper task in stage $stage"
            }
          }
          Install-TestCopy 'first-install'
          $binary = Join-Path $directory 'kongtrol.exe'
          $daemon = Start-Process $binary -ArgumentList 'daemon','--plain' -WorkingDirectory $directory -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              if ($daemon.HasExited -or (Get-Date) -gt $deadline) { throw 'Setup daemon failed to start' }
              Start-Sleep -Milliseconds 200
            } until ((Test-Path -LiteralPath $pidFile) -and (Get-Content -LiteralPath $pidFile -Raw).Trim() -eq $daemon.Id)
            foreach ($name in 'kongtrol.yaml', 'config.yaml') {
              if (Test-Path -LiteralPath (Join-Path $state $name)) { throw 'Expected no saved VPN profile' }
            }
            Install-TestCopy 'reinstall'
            if (!$daemon.WaitForExit(5000)) { throw 'Setup daemon kept the old executable open' }
          } finally {
            if (!$daemon.HasExited) { Stop-Process -InputObject $daemon -Force }
          }
      - name: Upload installer for signing
        id: unsigned-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-installer
          path: dist-extra/Kongtrol-Setup-windows-amd64.exe
          retention-days: 1
      - name: Sign installer (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-extra
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dist-extra/Kongtrol-Setup-windows-amd64.exe
          retention-days: 3

  # The release sources' tests, in parallel with the macOS and Windows
  # builds instead of inside `release` (they need nothing those jobs make).
  # `release` still waits for them: nothing is published unless they pass.
  test:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-ui-dist
          path: web/ui/dist
      - name: Test release sources
        run: go test -race ./cmd/kongtrol ./internal/...

  release:
    needs: [ui, macos, windows, test]
    runs-on: ubuntu-latest
    # Publishing secrets live in the protected `release` environment
    # (docs/DEVELOPMENT.md, ADR-0063).
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # cosign keyless, attestations, npm provenance
      attestations: write
    # No job-wide secrets: each token is set only on the step that uses it
    # (GoReleaser, Homebrew, npm), so third-party actions in this job never
    # see them; the tests run in the `test` job with a read-only token.
    steps:
      - name: Is npm publishing configured?
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "enabled=$([ -n "$NPM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false # nothing pushes with git; publishers use their own tokens
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-ui-dist
          path: web/ui/dist
      # dist-extra/ is gitignored, so GoReleaser still sees a clean tree.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app
          path: dist-extra
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: dist-extra

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # A stable tag's changelog starts at the previous stable tag (v0.7.0
      # from v0.6.0), not at its own rc on the same commit. Pre-release tags
      # keep GoReleaser's default (the tag before them).
      - name: Previous tag for the changelog
        id: prev
        run: |
          prev=""
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            prev="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$GITHUB_REF_NAME" | head -n1 || true)"
          fi
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "v2.20.2" # exact, same as ci.yml; Renovate bumps it
          args: release --clean
        env:
          # The tag that started this run. A stable tag on the commit of its
          # last rc (v0.7.0 on v0.7.0-rc.2) otherwise lets GoReleaser's own
          # `git describe` pick the rc and upload into that release (422
          # already_exists, run 44754426073).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Refresh landing for the published stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          LANDING_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_LANDING_DEPLOY_HOOK }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ -z "$LANDING_DEPLOY_HOOK" ]]; then
            echo "::notice::Set CLOUDFLARE_LANDING_DEPLOY_HOOK to refresh the site's release automatically."
          elif ! curl --fail --silent --max-time 20 --output /dev/null --request POST "$LANDING_DEPLOY_HOOK"; then
            echo "::warning::The release was published but Cloudflare did not accept the landing refresh."
          fi

      - name: Build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/kongtrol-cli_*/kongtrol*
            dist/kongtrol-tray_*/kongtrol-tray*
            dist-extra/*
            install.sh
            install.ps1

      - name: Homebrew formula (tap)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p brew-assets
          cp dist/kongtrol_linux_amd64.tar.gz dist/kongtrol_linux_arm64.tar.gz dist-extra/Kongtrol-macos-universal.zip brew-assets/
          bash packaging/homebrew/publish.sh "${GITHUB_REF_NAME#v}" brew-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.npm.outputs.enabled == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm packages
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$ver" in *-*) tag=next ;; esac
          # GoReleaser keeps each binary in its build folder
          # (dist/kongtrol-cli_<os>_<arch>_<variant>/); give them the
          # release asset names build.mjs expects.
          mkdir -p build/npm-bin
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            src=$(ls dist/kongtrol-cli_${t}_*/kongtrol*)
            ext=""; case "$t" in windows_*) ext=".exe" ;; esac
            cp "$src" "build/npm-bin/kongtrol-${t/_/-}${ext}"
          done
          node packaging/npm/build.mjs "$ver" build/npm-bin build/npm
          # Platform packages first: the main package depends on them.
          for d in build/npm/cli-*; do
            npm publish "$d" --provenance --access public --tag "$tag"
          done
          npm publish build/npm/kongtrol --provenance --access public --tag "$tag"
