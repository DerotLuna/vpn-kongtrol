name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Build native tray
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/tray
          CGO_ENABLED=1 go build -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" \
            -o "build/tray/kongtrol-tray-$(go env GOOS)-$(go env GOARCH)" ./cmd/kongtrol-tray
      - name: Build native Windows tray
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\tray | Out-Null
          $suffix = "$(go env GOOS)-$(go env GOARCH)"
          go build -ldflags "-X main.version=$env:GITHUB_REF_NAME -s -w -H=windowsgui" -o "build\tray\kongtrol-tray-$suffix.exe" ./cmd/kongtrol-tray
      - uses: actions/upload-artifact@v4
        with:
          name: tray-${{ runner.os }}-${{ runner.arch }}
          path: build/tray/*

  goreleaser:
    needs: tray
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test release sources
        run: go test -race ./cmd/kongtrol ./internal/...

      - uses: actions/download-artifact@v4
        with:
          pattern: tray-*
          path: build/tray
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
