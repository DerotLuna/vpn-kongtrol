name: landing-ci

# The landing is a Cloudflare Worker (static assets) at https://kongtrol.app (Cloudflare
# builds it from this repo: root `landing`, `pnpm run build`, `npx wrangler deploy`; see
# landing/wrangler.jsonc and ADR-0022).
#
# This workflow does two things:
#   1. build-landing — CI check on every PR/push that touches landing/.
#   2. redirect — on main, publishes tiny redirect stubs to the old GitHub Pages
#      address (derotluna.github.io/vpn-kongtrol/) so existing links and search
#      results land on kongtrol.app. Each stub has a meta refresh, a canonical
#      to the new URL and a plain link; 404.html maps any other old path.

on:
  pull_request:
    paths:
      - "landing/**"
      - "assets/brand/**"
      - "docs/cli.json" # the guide command reference is built from it
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "assets/brand/**"
      - "docs/cli.json" # the guide command reference is built from it
      - ".github/workflows/landing.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the build it supersedes. On main a run
# is never cancelled (it may be deploying); a newer one waits instead. The
# GitHub Pages deploy keeps its own job-level group below (never cancelled,
# as in GitHub's Pages starter workflows), so PR runs no longer queue behind
# deploys from main as they did with the old workflow-wide "pages" group.
# docs/adr/0059-ci-parallel-jobs-and-superseded-runs.md
concurrency:
  group: landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # jsdom (hydration check) needs Node >= 22.22; Node 20 is EOL
          cache: "pnpm"
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Every page × language hydrates its prerendered HTML without a mismatch
      # (scripts/check-hydration.mjs, ADR-0026). Fails the job on any mismatch.
      - name: Hydration check
        run: pnpm run check:hydration

  # The stubs are fixed text that never reads landing/, so this job does not
  # wait for build-landing (the real site is built and deployed by Cloudflare).
  redirect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect stubs
        run: |
          set -euo pipefail
          mkdir -p redirect/guia redirect/terminos
          stub() { # $1 = output file, $2 = target URL
            cat > "$1" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Kongtrol has moved to kongtrol.app</title>
          <link rel="canonical" href="$2">
          <meta http-equiv="refresh" content="0; url=$2">
          </head>
          <body>
          <p>Kongtrol now lives at <a href="$2">$2</a>.</p>
          </body>
          </html>
          HTML
          }
          stub redirect/index.html          "https://kongtrol.app/"
          stub redirect/guia.html           "https://kongtrol.app/guia"
          stub redirect/guia/index.html     "https://kongtrol.app/guia"
          stub redirect/terminos.html       "https://kongtrol.app/terminos"
          stub redirect/terminos/index.html "https://kongtrol.app/terminos"
          # any other old path: strip the /vpn-kongtrol prefix, keep the hash
          stub redirect/404.html            "https://kongtrol.app/"
          sed -i 's#</head>#<script>location.replace("https://kongtrol.app"+location.pathname.replace(/^\\/vpn-kongtrol/,"").replace(/\\.html$/,"")+location.hash)</script>\n</head>#' redirect/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
